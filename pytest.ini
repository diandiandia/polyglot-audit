# pytest configuration (DSR-023 / DSR-054):
# - tests/fixtures/** are audit TARGET fixtures (untrusted scanned data), not
#   test modules; collecting them would byte-compile target sources in place
#   and shift inventory denominators (see tests/snapshot/test_inventory_reconcile).
# - model_eval/records and performance/records are generated run artifacts.
[pytest]
testpaths = tests
norecursedirs = tests/fixtures .* build dist
